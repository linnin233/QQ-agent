# SnowLuma 协议端（QQ 侧，OneBot v11）—— docker compose
#
# 官方立场：Linux 上只通过 Docker 运行（容器内已封装 Linux QQ + Xvfb + VNC + noVNC + supervisord）。
# 见 https://snowluma.github.io/zh/docs/guide/deploy/docker
#
# 针对这台 2G 小机器做的取舍，改之前先读：
# 1. 端口全部只映射到宿主机回环，公网一个都不开；扫码走 SSH 隧道：
#      ssh -L 6081:127.0.0.1:6081 root@<服务器IP>  然后浏览器开 http://127.0.0.1:6081/vnc.html
# 2. 容器内 WebUI 必须监听 0.0.0.0，否则端口映射进不去（宿主机侧仍然只绑 127.0.0.1）。
# 3. mem_limit / memswap_limit 是这台机器能扛住的关键：内存打满时优先牺牲容器，
#    不要让它把 nginx / qq-agent 一起拖走。
# 4. shm_size 不能太小：QQ 基于 Chromium，/dev/shm 不够会直接崩。

services:
  snowluma:
    image: motricseven7/snowluma:latest
    container_name: snowluma
    restart: unless-stopped
    shm_size: 768m
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE                       # 必需：native addon 靠 ptrace 注入 QQ 进程
    security_opt:
      - seccomp=unconfined               # 必需：默认 seccomp 会拦 ptrace
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_WEBUI_HOST: 0.0.0.0       # 容器内监听全网卡，宿主机侧只绑回环
      SNOWLUMA_WEBUI_PORT: 5099
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_SCREEN: 1280x800x24
      SNOWLUMA_HOOK_AUTOLOAD: 1          # 登录后自动从被动观察切到工作模式
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
      VNC_PASSWD: "${VNC_PASSWD:?请先设置 VNC_PASSWD（deploy.conf 里的同名变量）}"
    ports:
      - "127.0.0.1:6081:6081"            # noVNC（扫码）
      - "127.0.0.1:5099:5099"            # SnowLuma WebUI
      - "127.0.0.1:3000:3000"            # OneBot HTTP
      - "127.0.0.1:3001:3001"            # OneBot WebSocket（qq-agent 连这个）
    volumes:
      - qq-gateway-data:/app/data        # SnowLuma 配置/缓存（含 onebot_<uin>.json 令牌）
      - qq-client-config:/app/.config    # QQ 客户端配置
      - qq-client-data:/app/.local/share # QQ 登录态（删了就掉登录）
    mem_limit: 1300m
    memswap_limit: 1900m

volumes:
  qq-gateway-data:
    name: qq-gateway-data
  qq-client-config:
    name: qq-client-config
  qq-client-data:
    name: qq-client-data
